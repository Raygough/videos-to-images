[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videos-to-images"
version = "0.2.0"
description = "Extract image frames from videos into a YOLO detection dataset (perceptual-hash matching, label filtering, depth maps)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["opencv", "yolo", "video", "frame-extraction", "perceptual-hash", "dataset"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
extract = ["opencv-python>=4"]
imaging = ["Pillow>=9"]
matching = ["numpy>=1.21"]
depth = ["torch", "numpy>=1.21", "Pillow>=9"]

[project.scripts]
videos-to-images = "extractor:run_cli"

[tool.setuptools]
py-modules = ["extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E9", "I"]